# Static site on Render. The GitHub Action publishes the page (site/ + data.json) to the `render` branch every day.
services:
  - type: web
    runtime: static
    name: voli-economici
    branch: render
    buildCommand: "true"
    staticPublishPath: .
    headers:
      - path: /data.json
        name: Cache-Control
        value: no-cache
