# Partenza
origin_city = "ROM"                 # codice città Travelpayouts (FCO + CIA)
origin_label = "Roma"
ryanair_airports = ["FCO", "CIA"]

# Periodi: tutti i weekend e i ponti entro questo orizzonte
horizon_days = 365
holiday_subdiv = "RM"               # aggiunge Santi Pietro e Paolo (29 giugno)
max_bridge_days = 1                 # giorni di ferie per fare il ponte (festa di giovedì → prendi venerdì)
depart_day_before = true            # parti anche la sera prima (es. venerdì)

delay_seconds = 0.3                 # pausa tra le richieste
state_file = "data/state.json"
site_data_file = "site/data.json"   # dati per la pagina web

[affiliate]                         # Travelpayouts: commissione sulle prenotazioni dai link Aviasales
marker = "788519"

[wizzair]                           # Wizz Air blocca chi fa troppe richieste: si va piano
airports = ["FCO", "CIA"]
horizon_days = 365
delay_seconds = 1.6                 # pausa tra le richieste (~1 ogni 2 s: più veloce blocca dopo ~50)
cooldown_seconds = 90               # attesa quando Wizz Air rallenta (errore 503)

[vueling]                           # la cache di Vueling a volte risponde con un'altra tratta: si riprova quando scade (~5 min)
airports = ["FCO"]                  # Vueling non vola da Ciampino
horizon_days = 365
tries = 3                           # tentativi per tratta prima di rinunciare

[lufthansa]                         # tutto il gruppo (Lufthansa, Swiss, Austrian, Brussels...): solo andata e ritorno, senza orari
airport = "FCO"
horizon_days = 365
workers = 3                         # richieste in parallelo
delay_seconds = 0.3

[iberia]                            # solo andata e ritorno, senza orari
airport = "FCO"
destinations = ["MAD"]              # da Roma Iberia vola diretto solo a Madrid
horizon_days = 365
delay_seconds = 1

# Per togliere una compagnia basta cancellare la sua sezione
[easyjet]                           # prezzo più basso di ogni giorno, senza orari
airports = ["FCO"]                  # easyJet non vola da Ciampino
horizon_days = 365
delay_seconds = 0.5

[ita]                               # ITA Airways, anche voli intercontinentali e con scalo: senza orari
airport = "FCO"
horizon_days = 365
workers = 5                         # richieste in parallelo (l'API è lenta)
delay_seconds = 0.3

[volotea]                           # prezzo più basso di ogni giorno, con orario
airports = ["FCO"]
horizon_days = 365
delay_seconds = 0.3

[transavia]                         # prezzo più basso di ogni giorno, senza orari
airports = ["FCO"]
horizon_days = 365
delay_seconds = 0.5

[sas]                               # prezzo più basso di ogni giorno, senza orari né scali
airport = "FCO"
destinations = ["CPH", "ARN", "OSL"]  # le mete dirette da Roma
horizon_days = 365
delay_seconds = 0.3

[airbaltic]                         # prezzo più basso di ogni giorno, diretti o via Riga: senza orari
airports = ["FCO"]
horizon_days = 365
delay_seconds = 0.3

[pegasus]                           # prezzo più basso di ogni giorno, via Istanbul: senza orari
airports = ["FCO"]
horizon_days = 365
delay_seconds = 0.5

[airtrfx]                           # tariffe cercate di recente sui siti delle compagnie: solo alcune date, senza orari
airport = "FCO"
airlines = ["tk", "tp", "vf", "at", "ux", "af", "kl", "a3"]  # Turkish, TAP, AJet, Royal Air Maroc, Air Europa, Air France, KLM, Aegean
horizon_days = 365
delay_seconds = 0.3

[times]                             # per escludere viaggi inutili o che richiedono ferie
day_before_from = "17:00"           # la sera prima: partenza dopo le 17
first_day_until = "14:00"           # il primo giorno libero: partenza entro le 14
return_from = "12:00"               # l'ultimo giorno: rientro dopo le 12

[deals]
discount = 0.5                      # avvisa se costa almeno la metà del prezzo tipico
min_saving_eur = 15                 # ...e risparmi almeno 15 €
min_samples = 5                     # periodi minimi con un prezzo per stimare il prezzo tipico
lookback_days = 90                  # storico usato per il prezzo tipico
realert_drop = 0.10                 # riavvisa sullo stesso volo solo se scende di un altro 10%
max_per_message = 40
