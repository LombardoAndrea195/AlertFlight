name: Voli economici

on:
  schedule:
    - cron: "0 6 * * *" # 8:00 ora italiana (7:00 d'inverno)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: voli-alert
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Daily run (or manual): search fares, send Telegram, write site/data.json
      - if: github.event_name != 'push'
        uses: astral-sh/setup-uv@v10.3.0

      - if: github.event_name != 'push'
        run: uv run python -m voli_alert
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salva lo storico prezzi
        if: github.event_name != 'push'
        run: |
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Storico prezzi $(date -u +%F)"
          git pull --rebase
          git push

      # Frontend-only change: republish the page with the data already online
      - name: Recupera i dati pubblicati
        if: github.event_name == 'push'
        run: |
          git fetch --depth=1 origin render && git show origin/render:data.json > site/data.json \
            || { echo "Nessun dato pubblicato, lancia il workflow a mano"; exit 1; }

      # Render serves the `render` branch as a static site and redeploys on every push.
      # The branch holds only the latest page, so its history does not grow.
      - name: Pubblica su Render
        run: |
          cd site
          git init -q -b render
          git add -A --force
          git commit -qm "Pagina $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" render
